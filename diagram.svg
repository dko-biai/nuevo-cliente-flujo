<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" font-family="DejaVu Sans Mono, monospace">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"></polygon>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"></path>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)"></rect>

        <!-- ============ STEP NUMBER BADGES ============ -->
        <circle cx="60" cy="132" r="14" fill="none" stroke="#22d3ee" stroke-width="1.5"></circle>
        <text x="60" y="137" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">1</text>

        <circle cx="60" cy="302" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5"></circle>
        <text x="60" y="307" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">2</text>

        <circle cx="60" cy="442" r="14" fill="none" stroke="#a78bfa" stroke-width="1.5"></circle>
        <text x="60" y="447" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">3</text>

        <circle cx="60" cy="582" r="14" fill="none" stroke="#34d399" stroke-width="1.5"></circle>
        <text x="60" y="587" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">4</text>

        <circle cx="515" cy="582" r="14" fill="none" stroke="#fb7185" stroke-width="1.5"></circle>
        <text x="515" y="587" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">5</text>

        <!-- ============ STEP 1 — LANDING (cyan, external) ============ -->
        <rect x="95" y="100" width="200" height="70" rx="6" fill="#0f172a"></rect>
        <rect x="95" y="100" width="200" height="70" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"></rect>
        <text x="195" y="126" fill="white" font-size="12" font-weight="600" text-anchor="middle">Landing</text>
        <text x="195" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">parquet originales del cliente</text>
        <text x="195" y="157" fill="#22d3ee" font-size="8" text-anchor="middle">gs://&lt;cliente&gt;-landing/</text>

        <!-- ============ STEP 2 — RAW + BRIDGE (amber, cloud) ============ -->
        <rect x="95" y="270" width="200" height="70" rx="6" fill="#0f172a"></rect>
        <rect x="95" y="270" width="200" height="70" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"></rect>
        <text x="195" y="296" fill="white" font-size="12" font-weight="600" text-anchor="middle">Raw</text>
        <text x="195" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">&lt;entidad&gt;/*.parquet · PARTITION_BY</text>
        <text x="195" y="327" fill="#fbbf24" font-size="8" text-anchor="middle">gs://&lt;cliente&gt;-raw/</text>

        <!-- celes-bridge -->
        <rect x="345" y="270" width="140" height="70" rx="6" fill="#0f172a"></rect>
        <rect x="345" y="270" width="140" height="70" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"></rect>
        <text x="415" y="300" fill="white" font-size="12" font-weight="600" text-anchor="middle">celes-bridge</text>
        <text x="415" y="316" fill="#94a3b8" font-size="8" text-anchor="middle">crea las external tables</text>

        <!-- ============ STEP 3 — SHARED (violet, database) ============ -->
        <rect x="95" y="410" width="390" height="70" rx="6" fill="#0f172a"></rect>
        <rect x="95" y="410" width="390" height="70" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"></rect>
        <text x="290" y="435" fill="white" font-size="12" font-weight="600" text-anchor="middle">celes-platform-shared</text>
        <text x="290" y="452" fill="#94a3b8" font-size="9" text-anchor="middle">external tables · autodetect (esquema congelado)</text>
        <text x="290" y="467" fill="#a78bfa" font-size="8" text-anchor="middle">&lt;cliente&gt;_raw_sales · &lt;cliente&gt;_raw_supply_chain</text>

        <!-- ============ STEP 4 — PIPELINE (emerald, backend) ============ -->
        <rect x="95" y="545" width="280" height="175" rx="8" fill="#0f172a"></rect>
        <rect x="95" y="545" width="280" height="175" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"></rect>
        <text x="235" y="568" fill="white" font-size="12" font-weight="600" text-anchor="middle">Pipeline dbt · por ambiente</text>
        <text x="235" y="584" fill="#94a3b8" font-size="9" text-anchor="middle">celes-platform-{dev,qas,prd}</text>
        <text x="235" y="600" fill="#34d399" font-size="8" text-anchor="middle">tenant id con sufijo por ambiente</text>

        <!-- stage chips -->
        <rect x="115" y="612" width="82" height="30" rx="4" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1"></rect>
        <text x="156" y="631" fill="white" font-size="9" font-weight="600" text-anchor="middle">10_ingestion</text>
        <line x1="197" y1="627" x2="208" y2="627" stroke="#34d399" stroke-width="1" marker-end="url(#ah)"></line>

        <rect x="212" y="612" width="82" height="30" rx="4" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1"></rect>
        <text x="253" y="631" fill="white" font-size="9" font-weight="600" text-anchor="middle">20_staging</text>

        <rect x="115" y="652" width="82" height="30" rx="4" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1"></rect>
        <text x="156" y="665" fill="white" font-size="8" font-weight="600" text-anchor="middle">50_datawarehouse</text>
        <text x="156" y="676" fill="#34d399" font-size="7" text-anchor="middle">(DM)</text>

        <rect x="212" y="652" width="82" height="30" rx="4" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1"></rect>
        <text x="253" y="672" fill="white" font-size="9" font-weight="600" text-anchor="middle">90_serving</text>

        <line x1="294" y1="642" x2="294" y2="650" stroke="#34d399" stroke-width="1" marker-end="url(#ah)"></line>
        <line x1="197" y1="667" x2="210" y2="667" stroke="#34d399" stroke-width="1" marker-end="url(#ah)"></line>

        <text x="235" y="706" fill="#34d399" font-size="7" text-anchor="middle">datasets: &lt;tenant&gt;_&lt;layer&gt;_&lt;env&gt;</text>

        <!-- ============ STEP 5 — NOT SHARED (rose, security) ============ -->
        <rect x="545" y="545" width="190" height="175" rx="6" fill="#0f172a"></rect>
        <rect x="545" y="545" width="190" height="175" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"></rect>
        <text x="640" y="566" fill="white" font-size="11" font-weight="600" text-anchor="middle">NO viven en shared</text>
        <text x="640" y="581" fill="#94a3b8" font-size="8" text-anchor="middle">6 tablas de infraestructura en</text>
        <text x="640" y="593" fill="#fb7185" font-size="8" text-anchor="middle">celes-platform-&lt;env&gt;</text>
        <text x="640" y="612" fill="#94a3b8" font-size="8" text-anchor="middle">• params_criteria</text>
        <text x="640" y="626" fill="#94a3b8" font-size="8" text-anchor="middle">• params_values</text>
        <text x="640" y="640" fill="#94a3b8" font-size="8" text-anchor="middle">• params_dynamic_values</text>
        <text x="640" y="654" fill="#94a3b8" font-size="8" text-anchor="middle">• request_drafts</text>
        <text x="640" y="668" fill="#94a3b8" font-size="8" text-anchor="middle">• orders</text>
        <text x="640" y="682" fill="#94a3b8" font-size="8" text-anchor="middle">• bom</text>

        <!-- ============ ONBOARDING (orange, right column) ============ -->
        <rect x="880" y="100" width="240" height="180" rx="8" fill="#0f172a"></rect>
        <rect x="880" y="100" width="240" height="180" rx="8" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"></rect>
        <text x="1000" y="126" fill="white" font-size="12" font-weight="600" text-anchor="middle">setup_new_client</text>
        <text x="1000" y="142" fill="#fb923c" font-size="8" text-anchor="middle">onboarding · dbt-models</text>
        <line x1="900" y1="154" x2="1100" y2="154" stroke="#fb923c" stroke-width="0.5" stroke-dasharray="3,3"></line>
        <text x="900" y="174" fill="#94a3b8" font-size="8">• ~50 archivos de plantillas</text>
        <text x="900" y="190" fill="#94a3b8" font-size="8">• 12 datasets / ambiente (10→90)</text>
        <text x="900" y="206" fill="#94a3b8" font-size="8">• 5 buckets GCS / ambiente</text>
        <text x="900" y="222" fill="#94a3b8" font-size="8">• forecast config en Datastore</text>
        <text x="900" y="238" fill="#94a3b8" font-size="8">• config.yml · dbt_project.yml</text>
        <text x="900" y="254" fill="#94a3b8" font-size="8">• selectors.yml</text>
        <text x="1000" y="272" fill="#fb923c" font-size="7" text-anchor="middle">POST /dbt/onboard_client · scripts/create_new_client.sh</text>

        <!-- ============ ARROWS (drawn after boxes so they sit on top) ============ -->
        <!-- 1 → 2 -->
        <line x1="195" y1="170" x2="195" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"></line>
        <text x="210" y="222" fill="#94a3b8" font-size="9">sube parquets</text>

        <!-- 2 → bridge -->
        <line x1="295" y1="305" x2="343" y2="305" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"></line>

        <!-- bridge → 3 -->
        <line x1="415" y1="340" x2="415" y2="384" stroke="#64748b" stroke-width="1.5"></line>
        <line x1="415" y1="384" x2="300" y2="384" stroke="#64748b" stroke-width="1.5"></line>
        <line x1="300" y1="384" x2="300" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"></line>
        <text x="340" y="398" fill="#94a3b8" font-size="9">crea externals</text>

        <!-- 3 → 4 (reads) -->
        <line x1="235" y1="480" x2="235" y2="543" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"></line>
        <text x="250" y="516" fill="#94a3b8" font-size="9">lee externals</text>

        <!-- onboard → 2 / 3 (provisions) -->
        <line x1="880" y1="300" x2="770" y2="300" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#ah)"></line>
        <text x="820" y="292" fill="#fb923c" font-size="8">provisiona</text>

        <line x1="880" y1="320" x2="740" y2="440" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#ah)"></line>

        <!-- ============ LEGEND (outside all boxes) ============ -->
        <text x="545" y="58" fill="white" font-size="10" font-weight="600">Leyenda</text>

        <rect x="545" y="72" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"></rect>
        <text x="567" y="80" fill="#94a3b8" font-size="8">Landing (cliente)</text>

        <rect x="545" y="88" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"></rect>
        <text x="567" y="96" fill="#94a3b8" font-size="8">GCS · Raw</text>

        <rect x="700" y="72" width="16" height="10" rx="2" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"></rect>
        <text x="722" y="80" fill="#94a3b8" font-size="8">Onboarding / plataforma</text>

        <rect x="700" y="88" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"></rect>
        <text x="722" y="96" fill="#94a3b8" font-size="8">BigQuery · shared</text>

        <rect x="855" y="72" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"></rect>
        <text x="877" y="80" fill="#94a3b8" font-size="8">Pipeline dbt</text>

        <rect x="855" y="88" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"></rect>
        <text x="877" y="96" fill="#94a3b8" font-size="8">Fuera de shared</text>

        <line x1="855" y1="104" x2="871" y2="104" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,3"></line>
        <text x="877" y="107" fill="#94a3b8" font-size="8">Provisiona (onboarding)</text>
      </svg>